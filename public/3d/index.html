<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>锦糸町风 · 国产品牌云逛街</title>
  <link rel="stylesheet" href="./style.css?v=cn-v2-20260913" />
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud left">
    <div class="title">国产品牌云逛街 · CN-V2</div>
    <div id="zone">区域：站前广场</div>
    <div id="shopHint">左右移动逛街，靠近店铺按 E 查看</div>
  </div>
  <div class="hud right">
    <button id="themeBtn" type="button">切换到白天</button>
  </div>
  <div class="hud bottom">
    <div>A/D 或 ←/→ 移动，W/S 微调站位，Shift 跑步，E 查看店铺</div>
  </div>
  <div id="shopPanel" class="panel hidden">
    <div class="panel-card">
      <button id="closeShop" class="close" type="button">×</button>
      <div id="shopTag" class="tag">品牌</div>
      <h2 id="shopTitle">店铺</h2>
      <p id="shopDesc">介绍</p>
      <div id="shopMeta" class="meta"></div>
    </div>
  </div>
  <script src="./bootstrap-cn-v2.js"></script>
</body>
</html>
