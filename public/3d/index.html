<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>锦糸町 3D Walk</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">
    <div class="loading-card">
      <div class="spinner"></div>
      <div id="loadingText">正在加载锦糸町附近地图…</div>
      <div class="sub">会从 OpenStreetMap / Overpass 获取建筑与道路，并生成带贴图感的可行走 3D 地图。</div>
    </div>
  </div>
  <div id="hud">
    <div class="title">錦糸町 3D WALK</div>
    <div id="coord">35.696799, 139.814049</div>
    <div id="stats">Buildings: --</div>
  </div>
  <div id="crosshair">+</div>
  <div id="help"><b>先点击画面进入步行模式</b><br>WASD / 方向键移动　Shift 加速　鼠标转向　Esc 释放鼠标</div>
  <div id="attribution">© OpenStreetMap contributors · Three.js</div>
  <button id="resetBtn" type="button">回到起点</button>
  <script type="module" src="./app.js"></script>
</body>
</html>
