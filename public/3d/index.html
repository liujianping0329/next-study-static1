<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinshicho Street Arcade</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="logo">KINSHICHO STREET ARCADE</div>
    <div id="zone">錦糸町駅前</div>
    <div id="shopHint">左右移动，开始逛街</div>
  </div>

  <div id="controls">
    <span>← → / A D 移动</span>
    <span>↑ ↓ / W S 走位</span>
    <span>Shift 跑步</span>
    <span>E 查看店铺</span>
  </div>

  <button id="themeBtn" type="button">切换白天</button>

  <div id="shopPanel" class="hidden">
    <button id="closeShop" type="button">×</button>
    <div id="shopTag">SHOP</div>
    <h2 id="shopTitle"></h2>
    <p id="shopDesc"></p>
    <div id="shopMeta"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
