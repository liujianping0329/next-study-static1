<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>逐時天氣</title>
<script src="./weather.js"></script>
<style>
:root{--line:rgba(255,255,255,.13);--text:#f6f8ff;--muted:#aebbd1;--now:#b8ffdd}
*{box-sizing:border-box}
html{background:#091121}
body{margin:0;min-height:100%;overflow-x:hidden;position:relative;isolation:isolate;background:transparent;color:var(--text);font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
button{font:inherit}
#sky,#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;transform:translateZ(0);backface-visibility:hidden}
#sky{background:linear-gradient(145deg,#0b1328,#192a4b);transition:background .7s ease}
#sky:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.24))}
.shell{position:relative;z-index:1;width:min(1200px,calc(100% - 24px));margin:auto;padding:28px 0 40px}
.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}
h1{font-size:clamp(28px,4vw,42px);margin:0 0 6px;letter-spacing:-.04em}.sub{color:var(--muted);font-size:13px}
.live{border:1px solid var(--line);background:rgba(8,18,38,.48);backdrop-filter:blur(14px);padding:9px 12px;border-radius:999px;font-size:12px;white-space:nowrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:1px solid var(--line);color:#d5e1f2;background:rgba(255,255,255,.06);padding:10px 15px;border-radius:14px;cursor:pointer}
.tab.active{background:#f6f9ff;color:#14213b;border-color:#fff}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;border:1px solid var(--line);border-radius:26px;padding:24px;background:linear-gradient(130deg,rgba(255,255,255,.14),rgba(255,255,255,.055));backdrop-filter:blur(17px)}
.place{color:#cbd9ed;font-size:13px}.current{display:flex;align-items:center;gap:18px;margin:17px 0 6px}.big-icon{font-size:60px}.temp{font-size:76px;font-weight:760;line-height:.9;letter-spacing:-.06em}
.condition{font-size:19px;font-weight:700}.desc{font-size:12px;color:var(--muted);margin-top:5px}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:center}
.metric{border:1px solid rgba(255,255,255,.09);background:rgba(4,14,31,.22);border-radius:17px;padding:14px}.metric .k{font-size:11px;color:#aab9cf;margin-bottom:6px}.metric .v{font-size:21px;font-weight:720}.metric .s{font-size:10px;color:#899bb4;margin-top:3px}
.section-head{display:flex;justify-content:space-between;gap:10px;align-items:end;margin:25px 2px 11px}.section-head h2{font-size:18px;margin:0}.section-head span{font-size:11px;color:var(--muted)}
.hourly{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(140px,1fr);gap:10px;overflow-x:auto;padding:3px 2px 16px;scroll-snap-type:x proximity}
.card{position:relative;scroll-snap-align:start;border:1px solid var(--line);background:rgba(255,255,255,.065);backdrop-filter:blur(13px);border-radius:20px;padding:13px;min-height:220px;transition:.2s}
.card.active-now{border-color:rgba(184,255,221,.95);background:linear-gradient(180deg,rgba(184,255,221,.17),rgba(255,255,255,.07));box-shadow:0 0 0 1px rgba(184,255,221,.1)}
.badge{display:none;position:absolute;right:9px;top:9px;background:var(--now);color:#11241c;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:800}.active-now .badge{display:block}
.hour{font-size:12px;font-weight:700;color:#cbd7e9}.ico{font-size:31px;margin:17px 0 6px}.ct{font-size:27px;font-weight:760}.cc{font-size:11px;color:#c8d6ea;margin:3px 0 13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.07);padding:5px 0;font-size:10px;color:#9fb0c9}.mini b{color:#edf4ff;font-size:11px}
.note{margin-top:14px;color:#7e91ad;font-size:10px;line-height:1.55}
.cloud{position:absolute;width:270px;height:66px;border-radius:80px;background:rgba(222,235,250,.11);animation:cloud 28s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:105px;height:105px;left:52px;top:-46px}.cloud:after{width:145px;height:145px;right:34px;top:-74px}.c1{top:14%;left:-330px}.c2{top:29%;left:-500px;transform:scale(.7);animation-delay:-12s}@keyframes cloud{to{left:115vw}}
.sun{position:absolute;right:8%;top:7%;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,#fff8b8 0 31%,#ffd66d 44%,rgba(255,213,105,.18) 68%,transparent 74%);opacity:0}
.rain{position:absolute;top:-65px;width:1.5px;height:52px;background:linear-gradient(transparent,rgba(194,225,255,.92));transform:rotate(12deg);animation:rain .95s linear infinite}@keyframes rain{to{transform:translate3d(-75px,115vh,0) rotate(12deg)}}
.wind{position:absolute;left:-30vw;width:27vw;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:wind 1.5s linear infinite}@keyframes wind{to{transform:translateX(150vw)}}
.heat{position:absolute;inset:-15%;opacity:0;background:repeating-radial-gradient(ellipse at 50% 110%,rgba(255,183,93,.20) 0 2px,transparent 3px 18px);filter:blur(5px);animation:heat 2.3s ease-in-out infinite}@keyframes heat{0%,100%{transform:translateY(8px) scale(1.02);opacity:.13}50%{transform:translateY(-7px) scale(1.06);opacity:.34}}
.flash{position:absolute;inset:0;background:#fff;opacity:0}.thunder .flash{animation:flash 5s infinite}@keyframes flash{0%,88%,92%,100%{opacity:0}89%{opacity:.58}90%{opacity:.08}91%{opacity:.38}}
.snow{position:absolute;top:-30px;color:#fff;animation:snow linear infinite}@keyframes snow{to{transform:translate3d(-35px,110vh,0) rotate(260deg)}}
.fog{position:absolute;left:-20vw;width:140vw;height:80px;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(240,247,255,.10),rgba(240,247,255,.2),rgba(240,247,255,.10),transparent);filter:blur(10px);animation:fog 12s ease-in-out infinite}@keyframes fog{50%{transform:translateX(10vw)}}
@media(max-width:720px){.hero{grid-template-columns:1fr;padding:19px}.metrics{grid-template-columns:repeat(2,1fr)}.hourly{grid-auto-columns:136px}.shell{width:calc(100% - 18px);padding-top:20px}.top{display:block}.live{width:max-content;margin-top:10px}.temp{font-size:64px}.big-icon{font-size:51px}.sun{width:90px;height:90px;right:4%}}
</style>
</head>
<body>
<div id="sky"></div>
<div id="fx"><div class="cloud c1"></div><div class="cloud c2"></div><div class="sun"></div><div class="heat"></div><div class="flash"></div><div id="particles"></div></div>
<main class="shell">
  <div class="top">
    <div><h1>逐時天氣</h1><div class="sub" id="generated"></div></div>
    <div class="live" id="clock">JST --:--</div>
  </div>
  <div class="tabs" id="tabs"></div>
  <section class="hero">
    <div>
      <div class="place" id="place"></div>
      <div class="current"><div class="big-icon" id="bigIcon"></div><div class="temp"><span id="temp"></span>°</div></div>
      <div class="condition" id="condition"></div>
      <div class="desc" id="desc"></div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="k">濕度</div><div class="v" id="humidity"></div><div class="s">相對濕度</div></div>
      <div class="metric"><div class="k">降雨機率</div><div class="v" id="pop"></div><div class="s">該時段預報</div></div>
      <div class="metric"><div class="k">UV 強度</div><div class="v" id="uv"></div><div class="s">UV index</div></div>
      <div class="metric"><div class="k">風速</div><div class="v" id="wind"></div><div class="s">僅供動畫判斷亦可隱藏</div></div>
    </div>
  </section>
  <div class="section-head"><h2>每小時預報</h2><span>按使用者目前時間自動高亮</span></div>
  <div class="hourly" id="hourly"></div>
  <div class="note">页面本身不请求 API。定时任务只需要生成并覆盖同目录的 weather.js；weather.html 可长期固定不变。</div>
</main>
<script>
(() => {
  const data = window.WEATHER_DATA;
  if (!data || !Array.isArray(data.locations) || !data.locations.length) {
    document.body.innerHTML = '<div style="padding:30px;color:white">weather.js 数据不存在或格式错误。</div>';
    return;
  }

  let activeId = data.locations[0].id;
  let renderedHourKey = "";
  const $ = s => document.querySelector(s);
  const tabs = $("#tabs"), hourly = $("#hourly"), fx = $("#fx"), sky = $("#sky"), particles = $("#particles");

  const fmt = new Intl.DateTimeFormat("ja-JP", { timeZone:data.timezone || "Asia/Tokyo", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hourCycle:"h23" });
  const hourFmt = new Intl.DateTimeFormat("ja-JP", { timeZone:data.timezone || "Asia/Tokyo", hour:"2-digit", hourCycle:"h23" });

  function nowMs(){ return Date.now(); }
  function currentFor(loc){
    const now = nowMs();
    const hs = loc.hours || [];
    let cur = hs.find((x,i)=>{
      const start = new Date(x.time).getTime();
      const end = i < hs.length-1 ? new Date(hs[i+1].time).getTime() : start + 3600000;
      return now >= start && now < end;
    });
    if (!cur && hs.length) cur = hs.reduce((best,x)=>Math.abs(new Date(x.time)-now)<Math.abs(new Date(best.time)-now)?x:best, hs[0]);
    return cur;
  }
  function typeBase(type){
    if (["rain","heavy_rain","light_rain"].includes(type)) return "rain";
    if (type==="thunderstorm") return "thunder";
    if (type==="snow") return "snow";
    if (type==="fog") return "fog";
    if (type==="wind") return "wind";
    if (type==="sunny") return "sunny";
    if (type==="partly_cloudy") return "partly";
    return "cloudy";
  }
  function clearParticles(){ particles.innerHTML=""; fx.className=""; }
  function addRain(n){
    n = matchMedia("(max-width:720px)").matches ? Math.round(n*.5) : n;
    for(let i=0;i<n;i++){ const e=document.createElement("i"); e.className="rain"; e.style.left=Math.random()*110+"vw"; e.style.animationDelay=-Math.random()*2+"s"; e.style.animationDuration=(.7+Math.random()*.65)+"s"; particles.appendChild(e); }
  }
  function addWind(n){
    n = matchMedia("(max-width:720px)").matches ? Math.round(n*.55) : n;
    for(let i=0;i<n;i++){ const e=document.createElement("i"); e.className="wind"; e.style.top=(8+Math.random()*82)+"%"; e.style.animationDelay=-Math.random()*2+"s"; e.style.animationDuration=(.8+Math.random()*1.2)+"s"; particles.appendChild(e); }
  }
  function addSnow(n){
    n = matchMedia("(max-width:720px)").matches ? Math.round(n*.55) : n;
    const chars=["❄","❅","✦"];
    for(let i=0;i<n;i++){ const e=document.createElement("i"); e.className="snow"; e.textContent=chars[i%chars.length]; e.style.left=Math.random()*110+"vw"; e.style.fontSize=(10+Math.random()*12)+"px"; e.style.animationDuration=(5+Math.random()*5)+"s"; e.style.animationDelay=-Math.random()*6+"s"; particles.appendChild(e); }
  }
  function addFog(n){ for(let i=0;i<n;i++){ const e=document.createElement("i"); e.className="fog"; e.style.top=(18+i*15)+"%"; e.style.animationDelay=-Math.random()*6+"s"; particles.appendChild(e); } }

  function applyFx(w){
    clearParticles();
    const base=typeBase(w.type);
    const sun=$("#fx .sun"), heat=$("#fx .heat");
    sun.style.opacity=(base==="sunny"||base==="partly")?"1":"0";
    heat.style.opacity=w.temp>=32?"1":"0";
    if(base==="sunny") sky.style.background="linear-gradient(145deg,#0b2e63,#3c83c9)";
    else if(base==="partly") sky.style.background="linear-gradient(145deg,#122642,#55779b)";
    else if(base==="rain") sky.style.background="linear-gradient(145deg,#0a162e,#314861)";
    else if(base==="thunder") sky.style.background="linear-gradient(145deg,#080e1b,#28243c)";
    else if(base==="snow") sky.style.background="linear-gradient(145deg,#17263d,#607da2)";
    else if(base==="fog") sky.style.background="linear-gradient(145deg,#1b2432,#687689)";
    else if(base==="wind") sky.style.background="linear-gradient(145deg,#10213f,#385a85)";
    else sky.style.background="linear-gradient(145deg,#111c31,#354963)";
    if(base==="rain"){ addRain(w.type==="heavy_rain"?100:70); }
    if(base==="thunder"){ fx.classList.add("thunder"); addRain(85); }
    if(base==="wind") addWind(20);
    if(base==="snow") addSnow(55);
    if(base==="fog") addFog(5);
    if(w.windKph>=35 && base!=="wind") addWind(12);
  }

  function renderTabs(){
    tabs.innerHTML=data.locations.map(l=>`<button class="tab ${l.id===activeId?"active":""}" data-id="${l.id}">${l.name}</button>`).join("");
    tabs.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{ activeId=b.dataset.id; renderedHourKey=""; renderAll(); }));
  }

  function renderAll(){
    const loc=data.locations.find(l=>l.id===activeId) || data.locations[0];
    const cur=currentFor(loc);
    if(!cur) return;
    renderTabs();
    $("#generated").textContent=`资料生成：${fmt.format(new Date(data.generatedAt))} · ${data.source||"weather"}`;
    $("#place").textContent=`⌖ ${loc.name} · ${loc.area||""}`;
    $("#bigIcon").textContent=cur.icon||"🌤️";
    $("#temp").textContent=Math.round(cur.temp);
    $("#condition").textContent=cur.label||cur.type;
    $("#desc").textContent=`当前采用 ${fmt.format(new Date(cur.time))} 时段预报 · ${cur.temp>=32?"高温效果 ON":"一般温度"}${cur.windKph>=35?" · 强风效果 ON":""}`;
    $("#humidity").textContent=cur.humidity+"%";
    $("#pop").textContent=cur.precipProbability+"%";
    $("#uv").textContent=Number(cur.uv).toFixed(1);
    $("#wind").textContent=cur.windKph+" km/h";
    hourly.innerHTML=(loc.hours||[]).map(x=>{
      const isNow=x.time===cur.time;
      return `<article class="card ${isNow?"active-now":""}">
        <div class="badge">現在</div>
        <div class="hour">${hourFmt.format(new Date(x.time))}:00</div>
        <div class="ico">${x.icon||"🌤️"}</div>
        <div class="ct">${Math.round(x.temp)}°</div>
        <div class="cc">${x.label||x.type}</div>
        <div class="mini"><span>濕度</span><b>${x.humidity}%</b></div>
        <div class="mini"><span>降雨</span><b>${x.precipProbability}%</b></div>
        <div class="mini"><span>UV</span><b>${Number(x.uv).toFixed(1)}</b></div>
      </article>`;
    }).join("");
    applyFx(cur);
    renderedHourKey=cur.time;
    setTimeout(()=>hourly.querySelector(".active-now")?.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"}),80);
  }

  function tick(){
    $("#clock").textContent="JST "+fmt.format(new Date()).replace(/^\d+\/\d+\s*/,"");
    const loc=data.locations.find(l=>l.id===activeId) || data.locations[0], cur=currentFor(loc);
    if(cur && cur.time!==renderedHourKey) renderAll();
  }

  renderAll();
  tick();
  setInterval(tick,30000);
})();
</script>
</body>
</html>
