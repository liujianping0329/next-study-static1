<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>天氣動畫展示版</title>
<style>
:root{
--bg1:#0b1328;--bg2:#1b2d50;--panel:rgba(255,255,255,.10);--panel2:rgba(255,255,255,.06);
--line:rgba(255,255,255,.12);--text:#f6f8ff;--muted:#aebbd1;--accent:#8fd3ff;
--now:#b8ffdd;--shadow:0 24px 70px rgba(0,0,0,.28)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#091121;color:var(--text);font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
html{background:#091121}
body{overflow-x:hidden;position:relative;isolation:isolate;background:transparent}
button{font:inherit}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:
radial-gradient(circle at 18% 10%,rgba(72,139,218,.42),transparent 33%),
radial-gradient(circle at 84% 24%,rgba(77,112,177,.28),transparent 30%),
linear-gradient(145deg,var(--bg1),var(--bg2));transition:background .8s ease}
.sky::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.20))}
.fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.layer{position:absolute;inset:0}
.sun-core{position:absolute;right:10%;top:8%;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#fff7b2 0 30%,#ffd56f 42%,rgba(255,213,111,.20) 68%,transparent 74%);opacity:0}
.sun-rays{position:absolute;right:5%;top:3%;width:220px;height:220px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,214,111,.22) 0deg 7deg,transparent 7deg 18deg);filter:blur(1px);animation:spin 16s linear infinite;opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{position:absolute;width:280px;height:70px;border-radius:80px;background:rgba(220,233,249,.10);filter:blur(1px);animation:cloudMove 28s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud::before{width:110px;height:110px;left:55px;top:-50px}.cloud::after{width:150px;height:150px;right:35px;top:-78px}
.cloud.c1{top:12%;left:-330px}.cloud.c2{top:27%;left:-480px;animation-delay:-11s;transform:scale(.7)}.cloud.c3{top:18%;left:-680px;animation-delay:-6s;transform:scale(.9)}
@keyframes cloudMove{to{left:115vw}}
.rain-drop{position:absolute;top:-70px;width:1.6px;height:58px;border-radius:50%;background:linear-gradient(transparent,rgba(189,224,255,.94));transform:rotate(12deg);animation:rain linear infinite}
@keyframes rain{to{transform:translate3d(-80px,115vh,0) rotate(12deg)}}
.wind-line{position:absolute;left:-28vw;width:26vw;height:2px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:wind 1.6s linear infinite}
@keyframes wind{to{transform:translateX(150vw)}}
.heat-wave{position:absolute;inset:-15%;opacity:0;background:repeating-radial-gradient(ellipse at 50% 110%,rgba(255,183,93,.20) 0 2px,transparent 3px 18px);filter:blur(5px);animation:heat 2.2s ease-in-out infinite}
@keyframes heat{0%,100%{transform:translateY(8px) scale(1.02);opacity:.14}50%{transform:translateY(-7px) scale(1.06);opacity:.34}}
.flash{position:absolute;inset:0;background:white;opacity:0}
.snowflake{position:absolute;top:-30px;color:rgba(255,255,255,.95);font-size:14px;animation:snow linear infinite}
@keyframes snow{to{transform:translate3d(-40px,112vh,0) rotate(300deg)}}
.fog-band{position:absolute;left:-20vw;width:140vw;height:84px;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(236,244,255,.09),rgba(236,244,255,.18),rgba(236,244,255,.09),transparent);filter:blur(10px);animation:fog 12s ease-in-out infinite}
@keyframes fog{0%,100%{transform:translateX(0)}50%{transform:translateX(10vw)}}
.drizzle-dot{position:absolute;top:-20px;width:2px;height:16px;border-radius:2px;background:rgba(190,224,255,.65);animation:drizzle linear infinite}
@keyframes drizzle{to{transform:translate3d(-40px,108vh,0)}}
.fx.sunny .sun-core,.fx.sunny .sun-rays{opacity:1}
.fx.partly .sun-core,.fx.partly .sun-rays{opacity:1}
.fx.wind .cloud{animation-duration:8s}
.fx.heat .heat-wave{opacity:1}
.fx.thunder .flash{animation:flash 5s infinite}
@keyframes flash{0%,88%,92%,100%{opacity:0}89%{opacity:.64}90%{opacity:.10}91%{opacity:.42}}
.shell{position:relative;z-index:1;width:min(1240px,calc(100% - 28px));margin:0 auto;padding:34px 0 48px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}
.brand h1{font-size:clamp(26px,4vw,42px);margin:0 0 7px;letter-spacing:-.03em}
.brand p{margin:0;color:var(--muted);font-size:14px}
.live{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(8,18,38,.44);backdrop-filter:blur(16px);font-size:13px;color:#dce9fa;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#7fffc2;box-shadow:0 0 0 5px rgba(127,255,194,.10);animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(127,255,194,0)}}
.tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
.tab{border:1px solid var(--line);background:rgba(255,255,255,.06);color:#cbd7ea;padding:10px 16px;border-radius:14px;cursor:pointer;transition:.2s}
.tab:hover{transform:translateY(-1px);background:rgba(255,255,255,.10)}
.tab.active{background:#f4f8ff;color:#14213b;border-color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:1.1fr .9fr;gap:18px;border:1px solid var(--line);border-radius:28px;padding:26px;background:linear-gradient(130deg,rgba(255,255,255,.14),rgba(255,255,255,.055));backdrop-filter:blur(18px);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-180px;top:-230px;background:radial-gradient(circle,rgba(162,215,255,.18),transparent 65%);pointer-events:none}
.place{display:flex;gap:10px;align-items:center;color:#cfe1f7;font-size:14px}
.current-row{display:flex;align-items:center;gap:18px;margin:18px 0 8px}
.big-icon{font-size:62px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.18))}
.temp{font-size:clamp(56px,9vw,86px);font-weight:750;line-height:.85;letter-spacing:-.07em}
.condition{font-size:19px;font-weight:650;margin-top:13px}
.summary{color:var(--muted);font-size:13px;margin-top:5px}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:center}
.metric{background:rgba(5,15,32,.23);border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:15px}
.metric .k{font-size:12px;color:#aab9cf;margin-bottom:7px}.metric .v{font-size:22px;font-weight:720}.metric .sub{font-size:11px;color:#8fa1bb;margin-top:3px}
.uv-bar{height:5px;background:rgba(255,255,255,.09);border-radius:99px;margin-top:9px;overflow:hidden}.uv-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#87e6b4,#f2d56f,#ff9d64);width:var(--uvw)}
.section-head{display:flex;justify-content:space-between;align-items:end;margin:28px 2px 12px}
.section-head h2{margin:0;font-size:19px}.section-head span{font-size:12px;color:var(--muted)}
.hourly{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(142px,1fr);gap:11px;overflow-x:auto;padding:4px 3px 17px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.card{scroll-snap-align:start;position:relative;min-height:226px;border:1px solid var(--line);border-radius:21px;padding:14px;background:rgba(255,255,255,.065);backdrop-filter:blur(14px);transition:.25s}
.card:hover{transform:translateY(-3px);background:rgba(255,255,255,.09)}
.card.is-now{border-color:rgba(184,255,221,.9);background:linear-gradient(180deg,rgba(184,255,221,.16),rgba(255,255,255,.07));box-shadow:0 0 0 1px rgba(184,255,221,.12),0 12px 35px rgba(0,0,0,.18)}
.now-badge{position:absolute;right:10px;top:10px;font-size:10px;font-weight:750;color:#10221b;background:var(--now);padding:4px 7px;border-radius:999px;display:none}.is-now .now-badge{display:block}
.hour{font-size:13px;color:#cbd7e9;font-weight:700}.weather-icon{font-size:33px;margin:17px 0 7px}.card-temp{font-size:28px;font-weight:760;letter-spacing:-.04em}.card-condition{font-size:12px;color:#c8d6ea;margin:3px 0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:5px 0;border-top:1px solid rgba(255,255,255,.07);color:#9fb0c9}.mini b{font-size:12px;color:#ecf3ff;font-weight:650}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}
.legend-item{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:16px;padding:14px}
.legend-item h3{margin:0 0 7px;font-size:15px}
.legend-item p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
.chipline{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.chip{font-size:11px;color:#adc0d9;padding:6px 9px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.source{margin-top:16px;color:#788aa5;font-size:11px;line-height:1.6}
@media(max-width:760px){
.shell{width:min(100% - 20px,1240px);padding-top:22px}.hero{grid-template-columns:1fr;padding:20px}
.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.metric{padding:11px}.metric .v{font-size:18px}.metric .sub{display:none}
.hourly{grid-auto-columns:137px}.legend{grid-template-columns:1fr}
}
@media(max-width:560px){
.topbar{display:block}.live{margin-top:12px;width:max-content}.brand h1{font-size:31px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
.sky,.fx{transform:translateZ(0);backface-visibility:hidden}
.rain-drop{height:44px}
.sun-core{width:96px;height:96px;right:5%;top:7%}
.sun-rays{width:180px;height:180px;right:-2%;top:2%}
}
@media(prefers-reduced-motion:reduce){
html{scroll-behavior:auto}
.tab,.card{transition:none}
.sun-rays{animation-duration:28s}
.cloud{animation-duration:42s}
.fx.wind .cloud{animation-duration:14s}
.rain-drop{animation-duration:1.5s!important}
.wind-line{animation-duration:2.5s!important}
.snowflake{animation-duration:8s!important}
.fog-band{animation-duration:18s!important}
.heat-wave{animation-duration:4s!important}
.fx.thunder .flash{animation-duration:8s}
}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="fx" id="fx">
<div class="layer">
<div class="sun-rays"></div>
<div class="sun-core"></div>
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>
<div class="heat-wave"></div>
<div class="flash"></div>
</div>
<div class="layer" id="particleLayer"></div>
<div class="layer" id="fogLayer"></div>
</div>
<main class="shell">
<div class="topbar">
<div class="brand">
<h1>天氣動畫展示版</h1>
<p>同樣風格下，以假資料展示各種天氣效果與逐時頁面互動</p>
</div>
<div class="live"><span class="dot"></span><span id="clock">JST --:--</span></div>
</div>
<div class="tabs" id="tabs"></div>
<section class="hero">
<div>
<div class="place">⌖ <span id="place"></span></div>
<div class="current-row">
<div class="big-icon" id="currentIcon"></div>
<div class="temp"><span id="currentTemp"></span><small style="font-size:.45em;letter-spacing:0">°</small></div>
</div>
<div class="condition" id="currentCondition"></div>
<div class="summary" id="currentSummary"></div>
</div>
<div class="metrics">
<div class="metric"><div class="k">濕度</div><div class="v" id="humidity"></div><div class="sub">相對濕度</div></div>
<div class="metric"><div class="k">降雨機率</div><div class="v" id="precip"></div><div class="sub">未來 1 小時</div></div>
<div class="metric"><div class="k">UV 強度</div><div class="v" id="uv"></div><div class="uv-bar"><i id="uvBar"></i></div></div>
<div class="metric"><div class="k">動畫效果</div><div class="v" id="effectName"></div><div class="sub" id="effectDesc"></div></div>
</div>
</section>
<div class="section-head">
<h2>每小時預報</h2>
<span>目前時段會自動高亮</span>
</div>
<div class="hourly" id="hourly"></div>
<div class="section-head" style="margin-top:24px">
<h2>效果說明</h2>
<span>目前展示的是假資料範例</span>
</div>
<div class="legend" id="legend"></div>
<div class="source">
這是靜態 HTML 展示版，目的是確認同一套 UI 在不同天氣下的動畫表現方式。之後若接 MSN 或其他來源，只要把資料結構換掉即可。
</div>
</main>

let active = "sunny";
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const tabs=$("#tabs"), hourly=$("#hourly"), fx=$("#fx"), sky=$("#sky"), particle=$("#particleLayer"), fog=$("#fogLayer"), legend=$("#legend");
Object.entries(scenarios).forEach(([key,v])=>{
const b=document.createElement("button");
b.className="tab";
b.dataset.key=key;
b.textContent=v.name;
b.onclick=()=>{active=key;render()};
tabs.appendChild(b);
const item=document.createElement("div");
item.className="legend-item";
item.innerHTML=`<h3>${v.icon} ${v.name}</h3><p>${v.legend}</p><div class="chipline">
<span class="chip">${v.effectTitle}</span>
<span class="chip">示意場景</span>
<span class="chip">假資料</span>
</div>`;
legend.appendChild(item);
});
function tokyoNow(){
const parts = new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
const get=t=>parts.find(x=>x.type===t)?.value||"00";
return {hour:Number(get("hour")),minute:get("minute")};
}
function nearestHour(hours,currentHour){
const exact=hours.find(x=>x.h===currentHour);
if(exact) return exact;
return hours.reduce((a,b)=>Math.abs(b.h-currentHour)<Math.abs(a.h-currentHour)?b:a);
}
function clearFX(){
fx.className="fx";
particle.innerHTML="";
fog.innerHTML="";
}
function mobileScale(count){
return window.matchMedia("(max-width: 560px)").matches ? Math.max(18,Math.round(count*.48)) : count;
}
function addRain(count=70,thin=false){
count=mobileScale(count);
for(let i=0;i<count;i++){
const d=document.createElement("i");
d.className=thin?"drizzle-dot":"rain-drop";
d.style.left=(Math.random()*110)+"vw";
d.style.animationDuration=(thin?1.3:0.8)+(Math.random()*(thin?0.9:0.6))+"s";
d.style.animationDelay=(-Math.random()*2)+"s";
d.style.opacity=.3+Math.random()*.6;
particle.appendChild(d);
}
}
function addWind(count=18){
count=mobileScale(count);
for(let i=0;i<count;i++){
const w=document.createElement("i");
w.className="wind-line";
w.style.top=(8+Math.random()*80)+"%";
w.style.animationDelay=(-Math.random()*1.8)+"s";
w.style.animationDuration=(0.8+Math.random()*1.1)+"s";
particle.appendChild(w);
}
}
function addSnow(count=55){
count=mobileScale(count);
const chars=["✦","✧","❄","❅","✻"];
for(let i=0;i<count;i++){
const s=document.createElement("i");
s.className="snowflake";
s.textContent=chars[Math.floor(Math.random()*chars.length)];
s.style.left=(Math.random()*110)+"vw";
s.style.animationDuration=(4.8+Math.random()*5.5)+"s";
s.style.animationDelay=(-Math.random()*6)+"s";
s.style.opacity=.35+Math.random()*.6;
s.style.fontSize=(10+Math.random()*12)+"px";
particle.appendChild(s);
}
}
function addFog(count=4){
for(let i=0;i<count;i++){
const b=document.createElement("i");
b.className="fog-band";
b.style.top=(18+i*15 + Math.random()*4)+"%";
b.style.animationDuration=(9+Math.random()*8)+"s";
b.style.animationDelay=(-Math.random()*6)+"s";
b.style.opacity=.5+Math.random()*.4;
fog.appendChild(b);
}
}
function setFX(scene){
clearFX();
fx.classList.add(scene.effect);
sky.style.background = scene.sky;
if(scene.effect==="rain") addRain(75,false);
if(scene.effect==="wind"){ addWind(20); }
if(scene.effect==="heat"){ fx.classList.add("sunny"); }
if(scene.effect==="thunder"){ addRain(85,false); }
if(scene.effect==="snow"){ addSnow(60); }
if(scene.effect==="fog"){ addFog(5); }
if(scene.effect==="partly"){ }
if(scene.effect==="sunny"){ }
}
function render(){
$$(".tab").forEach(b=>b.classList.toggle("active",b.dataset.key===active));
const scene=scenarios[active], now=tokyoNow(), current=nearestHour(scene.hours,now.hour);
$("#place").textContent=scene.place;
$("#currentIcon").textContent=current.icon;
$("#currentTemp").textContent=current.t;
$("#currentCondition").textContent=current.c;
$("#currentSummary").textContent=`${current.h}:00 的示意預報 · ${scene.effectTitle}`;
$("#humidity").textContent=current.hum+"%";
$("#precip").textContent=current.pop+"%";
$("#uv").textContent=current.uv.toFixed(1);
$("#uvBar").style.setProperty("--uvw",Math.min(100,current.uv/11*100)+"%");
$("#effectName").textContent=scene.effectTitle;
$("#effectDesc").textContent=scene.effectDesc;
hourly.innerHTML = scene.hours.map(x=>`<article class="card ${x.h===now.hour?"is-now":""}">
<div class="now-badge">現在</div>
<div class="hour">${String(x.h).padStart(2,"0")}:00</div>
<div class="weather-icon">${x.icon}</div>
<div class="card-temp">${x.t}°</div>
<div class="card-condition">${x.c}</div>
<div class="mini"><span>濕度</span><b>${x.hum}%</b></div>
<div class="mini"><span>降雨</span><b>${x.pop}%</b></div>
<div class="mini"><span>UV</span><b>${x.uv.toFixed(1)}</b></div>
</article>`).join("");
setFX(scene);
setTimeout(()=>hourly.querySelector(".is-now")?.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"}),120);
}
function tick(){
const n=tokyoNow();
$("#clock").textContent=`JST ${String(n.hour).padStart(2,"0")}:${n.minute}`;
}
tick(); setInterval(tick,15000); render();
</script>
</body>
</html>
