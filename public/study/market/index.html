<style>
:root{color-scheme:dark;--glass:rgba(255,255,255,.13);--line:rgba(255,255,255,.17);--muted:rgba(255,255,255,.70);--shadow:0 18px 55px rgba(5,18,40,.22)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}
body{background:#4e8ccb;color:#fff;overflow-x:hidden}button{font:inherit;color:inherit}
.sky{position:fixed;inset:0;z-index:-5;transition:background .7s ease;background:linear-gradient(180deg,#5ea9ee,#2f73be 50%,#2764a9)}
.sky:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 10%,rgba(255,255,255,.28),transparent 28%),linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.10))}
.sky[data-mode="rain"]{background:linear-gradient(180deg,#526f8d,#3f617f 48%,#294760)}.sky[data-mode="cloud"]{background:linear-gradient(180deg,#7f9fb9,#698ba9 44%,#456883)}
.sky[data-mode="clear"]{background:linear-gradient(180deg,#62b5f9,#2f8de2 50%,#1d67bb)}.sky[data-mode="thunder"]{background:linear-gradient(180deg,#303c56,#293a52 48%,#17263a)}
.scene{position:fixed;inset:0;z-index:-4;overflow:hidden;pointer-events:none}.sun{position:absolute;width:170px;height:170px;border-radius:50%;right:5vw;top:7vh;background:radial-gradient(circle,#fff 0 4%,#fff5bd 15%,#ffd96b 36%,rgba(255,221,105,.30) 62%,transparent 72%);opacity:0;transform:scale(.9);transition:.6s}
[data-mode="clear"]+.scene .sun{opacity:.95;transform:scale(1)}
.cloud{position:absolute;width:230px;height:75px;border-radius:60px;background:rgba(235,245,255,.18);filter:blur(6px);opacity:0}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:105px;height:105px;left:35px;bottom:10px}.cloud:after{width:130px;height:130px;right:22px;bottom:0}
.c1{top:16%;left:-7%;animation:cloudDrift 22s linear infinite}.c2{top:31%;left:48%;transform:scale(.7);animation:cloudDrift2 30s linear infinite}[data-mode="cloud"]+.scene .cloud,[data-mode="rain"]+.scene .cloud,[data-mode="thunder"]+.scene .cloud{opacity:.58}
@keyframes cloudDrift{to{transform:translateX(125vw)}}@keyframes cloudDrift2{from{transform:translateX(0) scale(.7)}to{transform:translateX(-120vw) scale(.7)}}
.rain{position:absolute;inset:-20%;opacity:0;background-image:repeating-linear-gradient(112deg,transparent 0 18px,rgba(214,235,255,.55) 19px 20px,transparent 21px 38px);background-size:38px 38px;background-position:0 0;animation:rainMove .72s linear infinite;transform:translateZ(0)}
[data-mode="rain"]+.scene .rain,[data-mode="thunder"]+.scene .rain{opacity:.72}@keyframes rainMove{from{background-position:0 0}to{background-position:38px 38px}}
.flash{position:absolute;inset:0;background:#fff;opacity:0}[data-mode="thunder"]+.scene .flash{animation:flash 5.4s infinite}@keyframes flash{0%,86%,90%,94%,100%{opacity:0}87%{opacity:.34}91%{opacity:.16}}
.app{max-width:980px;margin:auto;padding:max(22px,env(safe-area-inset-top)) 16px 44px}.segment{display:flex;gap:4px;padding:4px;margin:0 auto 24px;max-width:520px;background:rgba(32,67,104,.22);border:1px solid rgba(255,255,255,.12);border-radius:16px;backdrop-filter:blur(18px) saturate(145%)}
.segment button{flex:1;border:0;background:transparent;padding:9px 7px;border-radius:12px;font-weight:600;font-size:14px;opacity:.72;cursor:pointer;transition:.25s;min-width:0}.segment button.active{background:rgba(255,255,255,.23);opacity:1;box-shadow:0 3px 14px rgba(24,48,80,.18),inset 0 1px rgba(255,255,255,.17)}
.hero{text-align:center;padding:0 8px 25px;text-shadow:0 2px 10px rgba(0,32,72,.18)}.place{font-size:34px;font-weight:500;letter-spacing:-.8px}.subplace{margin-top:2px;color:var(--muted);font-size:14px}.temp{font-size:94px;line-height:.97;font-weight:200;letter-spacing:-7px;margin:8px 0 2px}.condition{font-size:21px;font-weight:500}.hilo{font-size:17px;margin-top:5px}.snapshot{font-size:11px;margin-top:8px;color:rgba(255,255,255,.53)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(22px) saturate(140%);overflow:hidden;margin-bottom:14px}.card-title{padding:13px 16px 10px;color:rgba(255,255,255,.65);font-size:12px;font-weight:700;letter-spacing:.45px;border-bottom:1px solid rgba(255,255,255,.10)}
.hourly{display:flex;overflow-x:auto;scroll-snap-type:x proximity;padding:14px 9px 16px;scrollbar-width:none}.hourly::-webkit-scrollbar{display:none}.hour{min-width:82px;text-align:center;scroll-snap-align:start;padding:4px}.htime{font-size:13px;font-weight:600;height:23px}.hicon{height:42px;display:flex;align-items:center;justify-content:center;font-size:28px}.hrain{height:18px;font-size:10px;font-weight:700;color:#8bd2ff}.htemp{font-size:17px;font-weight:600;margin-top:2px}.hmeta{font-size:10px;color:var(--muted);margin-top:3px}
.days{padding:0 14px 5px}.day{display:grid;grid-template-columns:70px 38px 46px 38px minmax(120px,1fr) 46px;align-items:center;gap:8px;min-height:59px;border-bottom:1px solid rgba(255,255,255,.11)}.day:last-child{border-bottom:0}.dname{font-size:16px;font-weight:600}.dicon{font-size:25px;text-align:center}.dp{font-size:11px;color:#83d3ff;font-weight:700;text-align:center}.low,.high{font-size:16px}.low{color:rgba(255,255,255,.58);text-align:right}.high{font-weight:600}.range{height:5px;position:relative;border-radius:20px;background:rgba(15,42,68,.23)}.range i{position:absolute;height:5px;border-radius:20px;background:linear-gradient(90deg,#75c9ff,#ffd75d,#ff9a55);box-shadow:0 0 10px rgba(255,208,95,.25)}
.src{font-size:10px;color:rgba(255,255,255,.52);text-align:center;padding:6px 10px 0}
@media(max-width:600px){.app{padding-left:10px;padding-right:10px}.segment{margin-bottom:19px}.place{font-size:30px}.temp{font-size:84px}.card{border-radius:20px}.day{grid-template-columns:58px 34px 36px 33px minmax(80px,1fr) 38px;gap:6px}.dname,.low,.high{font-size:14px}.dp{font-size:10px}}
@media(max-width:370px){.segment button{font-size:12px;padding-inline:4px}.hour{min-width:75px}.day{grid-template-columns:52px 31px 32px 31px minmax(66px,1fr) 35px}}
</style>
</head>
<body>

<script>

function render(){const d=DATA.locations[current],h=d.hourly[0],day=d.daily[0];$("place").textContent=current;$("subplace").textContent=d.subtitle;$("temp").textContent=Math.round(h[1])+"°";$("condition").textContent=h[4];$("hilo").textContent=`最高 ${Math.round(day[3])}° · 最低 ${Math.round(day[4])}°`;$("snapshot").textContent="更新 "+DATA.updated;sky.dataset.mode=modeOf(h[4]);

$("hourly").innerHTML=d.hourly.map((x,i)=>`<div class="hour"><div class="htime">${i===0?"現在":String(x[0]).padStart(2,"0")+"時"}</div><div class="hicon">${iconOf(x[4],x[0])}</div><div class="hrain">${x[2]>0?x[2].toFixed(1)+" mm":"&nbsp;"}</div><div class="htemp">${Math.round(x[1])}°</div><div class="hmeta">風 ${x[3].toFixed(1)} m/s</div></div>`).join("");
const lows=d.daily.map(x=>x[4]),highs=d.daily.map(x=>x[3]),min=Math.min(...lows),max=Math.max(...highs),span=Math.max(1,max-min);$("days").innerHTML=d.daily.map((x,i)=>{const left=(x[4]-min)/span*100,width=Math.max(10,(x[3]-x[4])/span*100),ww=Math.min(100-left,width);return`<div class="day"><div class="dname">${i===0?"今天":"週"+x[1]}</div><div class="dicon">${iconOf(x[2],12)}</div><div class="dp">${x[5]}%</div><div class="low">${Math.round(x[4])}°</div><div class="range"><i style="left:${left}%;width:${ww}%"></i></div><div class="high">${Math.round(x[3])}°</div></div>`}).join("")}
