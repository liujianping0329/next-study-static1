<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>天氣儀表板｜2026-09-13</title>
<meta name="weather-ui-spec" content="neutral-dashboard-v1-2026-09-13">
<meta name="weather-snapshot" content="2026-09-13 12:00 JST">
<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#172033;--muted:#687386;--line:#dfe6ef;--accent:#3578e5;--rain:#2b72c7;--shadow:0 10px 28px rgba(38,61,90,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Noto Sans TC","Noto Sans JP",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{overflow-x:hidden}button{font:inherit}.wrap{width:min(1120px,calc(100% - 24px));margin:auto;padding:24px 0 42px}.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}h1{font-size:24px;margin:0 0 4px}.updated{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;color:#425066;border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:700}.tab.active{background:#1f5fbd;border-color:#1f5fbd;color:#fff}.summary{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-bottom:14px}.summary-card,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.summary-card{padding:20px;display:flex;justify-content:space-between;align-items:center;gap:16px;position:relative;overflow:hidden}.summary-card:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-65px;top:-75px;background:linear-gradient(135deg,rgba(66,133,244,.16),rgba(83,197,255,.06))}.place{font-size:22px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:4px}.current{display:flex;align-items:center;gap:12px;margin-top:14px}.big-icon{font-size:44px}.big-temp{font-size:42px;line-height:1;font-weight:800}.cond{font-size:14px;color:var(--muted);margin-top:4px}.mini{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini div{background:#f7f9fc;border:1px solid #e8edf4;border-radius:12px;padding:13px}.mini b{display:block;font-size:21px;margin-top:3px}.mini span{font-size:11px;color:var(--muted)}.panel{overflow:hidden;margin-bottom:14px}.panel-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.panel-head h2{font-size:15px;margin:0}.panel-head span{font-size:11px;color:var(--muted)}.hourly{display:flex;gap:10px;overflow-x:auto;padding:14px;scrollbar-width:thin}.hour{min-width:96px;border:1px solid #e3e9f1;background:#f9fbfd;border-radius:13px;padding:11px 9px;text-align:center;position:relative;overflow:hidden}.hour.rain:before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(112deg,transparent 0 18px,rgba(43,114,199,.13) 19px 20px,transparent 21px 38px);background-size:38px 38px;animation:rainMove 1.6s linear infinite;pointer-events:none}@keyframes rainMove{from{background-position:0 0}to{background-position:38px 38px}}.hour>*{position:relative}.ht{font-size:12px;font-weight:800}.hi{font-size:28px;margin:7px 0 4px}.hdeg{font-size:20px;font-weight:800}.hm{font-size:10px;color:var(--muted);line-height:1.5}.days{padding:0 14px 8px}.day{display:grid;grid-template-columns:74px 42px 1fr 58px 58px;gap:10px;align-items:center;min-height:60px;border-bottom:1px solid #edf1f6}.day:last-child{border-bottom:0}.day-name{font-weight:800;font-size:14px}.day-icon{font-size:24px;text-align:center}.forecast{font-size:12px;color:#4d5b6f}.pop{font-size:11px;color:var(--rain);font-weight:800}.low,.high{font-size:14px;text-align:right}.low{color:#748094}.temp-range{grid-column:3/6;height:5px;background:#e8edf3;border-radius:99px;position:relative;margin:-9px 0 7px 0}.temp-range i{position:absolute;height:5px;border-radius:99px;background:linear-gradient(90deg,#69b9ef,#f8c34f,#f08a4b)}
@media(max-width:760px){.wrap{width:min(100% - 16px,1120px);padding-top:14px}.topbar{align-items:flex-start;flex-direction:column}.tabs{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}.tab{padding:8px 4px;font-size:12px}.summary{grid-template-columns:1fr}.summary-card,.mini{padding:15px}.day{grid-template-columns:62px 34px 1fr 44px 44px;gap:6px}.forecast{font-size:11px}.hour{min-width:88px}}
@media(max-width:390px){h1{font-size:21px}.place{font-size:19px}.big-temp{font-size:36px}.day{grid-template-columns:54px 30px 1fr 40px 40px;gap:4px}.forecast{font-size:10px}.low,.high{font-size:13px}}
</style>
</head>
<body>
<main class="wrap">
<div class="topbar"><div><h1>天氣儀表板</h1><div class="updated" id="updated"></div></div><div class="tabs" id="tabs"></div></div>
<section class="summary"><div class="summary-card"><div><div class="place" id="place"></div><div class="sub" id="sub"></div><div class="current"><div class="big-icon" id="currentIcon"></div><div><div class="big-temp" id="currentTemp"></div><div class="cond" id="currentCond"></div></div></div></div></div><div class="summary-card mini"><div><span>今日最高</span><b id="high"></b></div><div><span>今日最低</span><b id="low"></b></div><div><span>降雨機率</span><b id="pop"></b></div><div><span>更新</span><b style="font-size:14px" id="time"></b></div></div></section>
<section class="panel"><div class="panel-head"><h2>每小時天氣</h2><span>橫向滑動查看更多</span></div><div class="hourly" id="hourly"></div></section>
<section class="panel"><div class="panel-head"><h2>未來 7 日</h2><span>最高 / 最低溫與降雨機率</span></div><div class="days" id="days"></div></section>
</main>
<script>
const DATA={updated:"2026-09-13 12:00 JST",locations:{
"錦糸町":{subtitle:"東京都 墨田區",current:[24,"多雲"],hourly:[[12,24,0,2,"多雲"],[13,25,0,2,"多雲"],[14,26,0,3,"多雲"],[15,27,0,3,"晴"],[16,26,0,3,"晴"],[17,26,0,3,"晴"],[18,26,0,3,"多雲"],[19,26,0,3,"多雲"],[20,26,0,3,"多雲"],[21,25,0,3,"多雲"],[22,25,0,3,"晴"],[23,25,0,3,"晴"]],daily:[["09/13","日","多雲時晴",27,20,30],["09/14","一","晴時多雲",30,24,30],["09/15","二","小雨",26,24,60],["09/16","三","有雨",25,21,60],["09/17","四","雨雷",25,20,60],["09/18","五","雨雷",23,18,40],["09/19","六","間歇雨",26,19,60]]},
"渋谷":{subtitle:"東京都 渋谷區",current:[24,"多雲"],hourly:[[12,24,0,2,"多雲"],[13,25,0,3,"多雲"],[14,27,0,3,"多雲"],[15,27,0,3,"晴"],[16,26,0,3,"晴"],[17,26,0,3,"晴"],[18,25,0,3,"晴"],[19,25,0,3,"多雲"],[20,25,0,3,"多雲"],[21,25,0,3,"多雲"],[22,25,0,3,"晴"],[23,25,0,3,"晴"]],daily:[["09/13","日","局部雷雨",27,20,30],["09/14","一","晴時多雲",31,24,30],["09/15","二","陣雨",27,23,60],["09/16","三","小雨",25,21,60],["09/17","四","多場陣雨",25,20,60],["09/18","五","雨雷",23,18,40],["09/19","六","有雨",26,19,60]]},
"桑名":{subtitle:"三重縣 桑名市",current:[27,"多雲"],hourly:[[12,27,0,3,"多雲"],[13,28,1,3,"雨"],[14,29,1,3,"雨"],[15,29,0,3,"多雲"],[16,28,0,3,"多雲"],[17,28,0,3,"多雲"],[18,27,0,2,"多雲"],[19,27,0,2,"多雲"],[20,26,0,2,"多雲"],[21,26,0,2,"多雲"],[22,26,1,1,"雨"],[23,26,1,1,"雨"]],daily:[["09/13","日","多雲時雨",29,24,50],["09/14","一","多場雷雨",31,25,70],["09/15","二","雨雷",26,24,80],["09/16","三","多場陣雨",31,23,60],["09/17","四","局部雷雨",28,23,60],["09/18","五","雨雷",31,22,40],["09/19","六","小雨",29,23,60]]}
}};
const $=id=>document.getElementById(id),tabs=$("tabs");let current=Object.keys(DATA.locations)[0];
function icon(w){if(/雷/.test(w))return"⛈️";if(/雨/.test(w))return"🌧️";if(/晴/.test(w)&&/雲|多雲/.test(w))return"🌤️";if(/晴/.test(w))return"☀️";return"☁️"}
function label(d,i){return i===0?"今天":`週${d[1]}`}
function render(){const d=DATA.locations[current],all=d.daily.flatMap(x=>[x[4],x[3]]),mn=Math.min(...all),mx=Math.max(...all),span=Math.max(1,mx-mn),today=d.daily[0];$("updated").textContent=`資料更新：${DATA.updated}`;$("place").textContent=current;$("sub").textContent=d.subtitle;$("currentIcon").textContent=icon(d.current[1]);$("currentTemp").textContent=`${d.current[0]}°`;$("currentCond").textContent=d.current[1];$("high").textContent=`${today[3]}°`;$("low").textContent=`${today[4]}°`;$("pop").textContent=`${today[5]}%`;$("time").textContent=DATA.updated.replace("2026-09-13 ","");tabs.innerHTML=Object.keys(DATA.locations).map(n=>`<button class="tab ${n===current?"active":""}" data-name="${n}">${n}</button>`).join("");tabs.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{current=b.dataset.name;render()});$("hourly").innerHTML=d.hourly.map((x,i)=>`<div class="hour ${/雨/.test(x[4])?"rain":""}"><div class="ht">${i===0?"現在":String(x[0]).padStart(2,"0")+":00"}</div><div class="hi">${icon(x[4])}</div><div class="hdeg">${x[1]}°</div><div class="hm">${x[4]}<br>雨 ${x[2]} mm<br>風 ${x[3]} m/s</div></div>`).join("");$("days").innerHTML=d.daily.map((x,i)=>{const left=Math.max(0,Math.min(92,(x[4]-mn)/span*80+5)),width=Math.max(8,Math.min(95-left,(x[3]-x[4])/span*80));return`<div class="day"><div class="day-name">${label(x,i)}<div class="pop">${x[5]}%</div></div><div class="day-icon">${icon(x[2])}</div><div class="forecast">${x[0]} · ${x[2]}</div><div class="low">${x[4]}°</div><div class="high">${x[3]}°</div><div class="temp-range"><i style="left:${left}%;width:${width}%"></i></div></div>`}).join("")}
render();
</script>
</body>
</html>
