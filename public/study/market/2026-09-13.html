<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2026-09-13｜天氣・股市・匯率</title>
</head>
<body>
<script>
(async()=>{
  const snapshot="_snapshot-2026-09-13-1515.html";
  const s=await fetch(snapshot,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(`snapshot ${r.status}`);return r.text()});
  const m=s.match(/const b='([^']+)'/);
  if(!m)throw new Error("snapshot payload not found");
  const u=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0));
  let t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  const css=`<style id="release-banner-style">
  #releaseBanner{max-width:1000px;margin:8px auto 4px;padding:9px 12px;border:1px solid #cbd5e1;border-radius:11px;background:linear-gradient(90deg,#f8fbff,#eef5fb);color:#334155;display:flex;align-items:center;justify-content:space-between;gap:12px;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 4px 14px rgba(15,23,42,.04)}
  #releaseBanner .rb-title{font-size:13px;font-weight:900;white-space:nowrap}#releaseBanner .rb-meta{font-size:10px;color:#64748b;text-align:right;line-height:1.45}#releaseBanner .rb-chip{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-weight:800;white-space:nowrap}
  @media(max-width:720px){#releaseBanner{margin:6px 4px 4px;padding:8px 9px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;border-radius:9px}#releaseBanner .rb-title{font-size:12px;white-space:normal;line-height:1.25;min-width:0}#releaseBanner .rb-meta{font-size:9px;text-align:right;white-space:nowrap}#releaseBanner .rb-detail{grid-column:1/-1;font-size:9px;color:#64748b;line-height:1.35;white-space:normal;overflow-wrap:anywhere}#releaseBanner .rb-chip{margin-left:4px;padding:1px 5px}}
  @media(max-width:390px){#releaseBanner{margin-left:3px;margin-right:3px;padding:7px 8px;grid-template-columns:1fr}#releaseBanner .rb-meta{text-align:left;white-space:normal}#releaseBanner .rb-title{font-size:11px}#releaseBanner .rb-detail{font-size:8.5px}#releaseBanner .rb-chip{margin-left:0;margin-right:4px}}

  /* Mobile hourly weather: fit all seven columns in one viewport */
  @media(max-width:720px){
    .mc{padding-left:4px!important;padding-right:4px!important}.card{border-radius:9px!important}.hd{padding:6px 7px!important}.p{font-size:13px!important}.sum{font-size:8px!important;max-width:52%!important}
    .tw{overflow-x:hidden!important;width:100%!important}.tw table{width:100%!important;min-width:0!important;max-width:100%!important;table-layout:fixed!important;border-spacing:0 3px!important}
    .tw th,.tw td{padding:2px 0!important;overflow:hidden!important;text-overflow:clip!important;white-space:nowrap!important}.tw th{font-size:7.2px!important;letter-spacing:-.15px!important;height:24px!important}.tw td{font-size:9px!important;height:32px!important;line-height:1.12!important}
    .tw th:nth-child(1),.tw td:nth-child(1){width:13%!important}.tw th:nth-child(2),.tw td:nth-child(2){width:19%!important}.tw th:nth-child(3),.tw td:nth-child(3){width:13%!important}.tw th:nth-child(4),.tw td:nth-child(4){width:16%!important}.tw th:nth-child(5),.tw td:nth-child(5){width:13%!important}.tw th:nth-child(6),.tw td:nth-child(6){width:14%!important}.tw th:nth-child(7),.tw td:nth-child(7){width:12%!important}
    .t{font-size:9px!important;letter-spacing:-.2px!important}tr.now .t:after{font-size:5.8px!important;margin-left:1px!important;padding:1px 2px!important;vertical-align:1px!important}.wi{font-size:12px!important;line-height:11px!important;gap:1px!important;height:13px!important}.wx{font-size:6.2px!important;line-height:1.05!important;letter-spacing:-.1px!important;max-width:100%!important;overflow:hidden!important}.tp{font-size:9px!important}.mm{font-size:8.6px!important}.uv{width:14px!important;height:14px!important;font-size:7px!important}.windIcon{width:12px!important;height:8px!important}
  }
  @media(max-width:390px){.w{padding-left:3px!important;padding-right:3px!important}.mc{padding-left:3px!important;padding-right:3px!important}.hd{padding-left:6px!important;padding-right:6px!important}.tw th{font-size:6.7px!important;letter-spacing:-.25px!important}.tw td{font-size:8.5px!important}.t,.tp{font-size:8.5px!important}.wi{font-size:11px!important}.wx{font-size:5.8px!important}.mm{font-size:8px!important}.uv{width:13px!important;height:13px!important;font-size:6.5px!important}}
  @media(max-width:360px){.tw th{font-size:6.3px!important}.tw td,.t,.tp{font-size:8px!important}.wx{font-size:5.4px!important}.wi{font-size:10.5px!important}.mm{font-size:7.6px!important}.uv{width:12px!important;height:12px!important;font-size:6px!important}}
  </style>`;
  const banner=`<div id="releaseBanner"><div class="rb-title">天氣・股市・匯率</div><div class="rb-meta">09/13 16:34 JST <span class="rb-chip">新版</span></div><div class="rb-detail">手機每小時天氣已改為單屏完整顯示 7 欄；大風動畫維持定稿樣式。</div></div>`;
  t=t.replace(/<\/head>/i,css+"</head>");
  t=t.replace(/<body([^>]*)>/i,`<body$1>${banner}`);
  document.open();document.write(t);document.close();
})().catch(e=>{document.body.innerHTML=`<pre style="white-space:pre-wrap;padding:16px;font-family:system-ui">頁面載入失敗：${String(e)}</pre>`});
</script>
</body>
</html>
