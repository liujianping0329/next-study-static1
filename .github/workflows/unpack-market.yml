name: Normalize market HTML

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[plain-market]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build browser-safe plain HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64,gzip,datetime,zoneinfo
          root=Path('public/study/market'); p=root/'index.html'
          def plain(path):
              s=path.read_text(encoding='utf-8')
              m=re.search(r"const b='([^']+)'",s)
              if not m:return s
              raw=m.group(1).strip(); raw+='='*(-len(raw)%4)
              return gzip.decompress(base64.b64decode(raw,validate=False)).decode('utf-8')
          try:t=plain(p); source='index'
          except Exception as e:
              print('index payload broken:',e); t=None
              for q in sorted(root.glob('_snapshot*.html'),key=lambda x:x.stat().st_mtime,reverse=True):
                  try:t=plain(q);source=q.name;break
                  except Exception as se:print('snapshot rejected',q.name,se)
              if t is None:raise SystemExit('no recoverable dashboard')
          if re.search(r'\bfetch\s*\(|XMLHttpRequest\s*\(',t) or 'DecompressionStream' in t or 'atob(' in t:
              raise SystemExit('browser-side loader/compression still present')

          # Mobile-approved hourly layout: 7 columns. Keep wind data for animation,
          # but show speed inside weather text only when it is actually a high-wind row.
          t=t.replace('<th>雨量</th><th>風速</th><th>UV</th>','<th>雨量</th><th>UV</th>')
          t=t.replace('<td>${w.toFixed(1)} km/h</td><td>${fmt(uv)}</td>','<td>${fmt(uv)}</td>')
          t=t.replace("${z}</div></td><td>${t.toFixed(1)}°</td>","${z}${w>32?' '+w.toFixed(0)+'km/h':''}</div></td><td>${t.toFixed(1)}°</td>")

          css='''<style id="mobile-hourly-hw-7col-fix">
          @media(max-width:720px){.hw{overflow-x:hidden!important;width:100%!important}.hw table{width:100%!important;min-width:0!important;max-width:100%!important;table-layout:fixed!important;border-spacing:0 3px!important}.hw th,.hw td{padding:2px 0!important;overflow:hidden!important;white-space:nowrap!important;line-height:1.08!important}.hw th{font-size:6.8px!important;height:23px!important}.hw td{font-size:8.5px!important;height:34px!important}.hw th:nth-child(1),.hw td:nth-child(1){width:13%!important}.hw th:nth-child(2),.hw td:nth-child(2){width:21%!important}.hw th:nth-child(3),.hw td:nth-child(3){width:13%!important}.hw th:nth-child(4),.hw td:nth-child(4){width:15%!important}.hw th:nth-child(5),.hw td:nth-child(5){width:13%!important}.hw th:nth-child(6),.hw td:nth-child(6){width:13%!important}.hw th:nth-child(7),.hw td:nth-child(7){width:12%!important}.hw td:nth-child(2) div{font-size:5.8px!important;overflow:hidden!important;text-overflow:clip!important}tr.now td:first-child:after{font-size:5.6px!important;padding:1px 2px!important;margin-left:1px!important}.w{padding-left:3px!important;padding-right:3px!important}.b{padding-left:3px!important;padding-right:3px!important}}
          @media(max-width:390px){.hw th{font-size:6.3px!important}.hw td{font-size:8px!important}.hw td:nth-child(2) div{font-size:5.3px!important}}
          @media(max-width:360px){.hw th{font-size:6px!important}.hw td{font-size:7.6px!important}.hw td:nth-child(2) div{font-size:5px!important}}
          </style>'''
          if 'mobile-hourly-hw-7col-fix' not in t:t=re.sub(r'</head>',css+'</head>',t,count=1,flags=re.I)

          now=datetime.datetime.now(zoneinfo.ZoneInfo('Asia/Tokyo')); stamp=now.strftime('%m/%d %H:%M JST')
          bcss='''<style id="release-mobile-banner">#releaseBanner{max-width:1000px;margin:6px auto 4px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:10px;background:#f3f7fb;color:#334155;font:11px system-ui,-apple-system,sans-serif;display:flex;justify-content:space-between;gap:8px;box-sizing:border-box}#releaseBanner b{font-size:12px}@media(max-width:720px){#releaseBanner{margin:5px 4px;padding:7px 8px;display:block;line-height:1.4}#releaseBanner span{display:block;font-size:9px;margin-top:2px}}</style>'''
          if 'release-mobile-banner' not in t:t=re.sub(r'</head>',bcss+'</head>',t,count=1,flags=re.I)
          if 'id="releaseBanner"' not in t:
              banner=f'<div id="releaseBanner"><b>天氣・股市・匯率</b><span>{stamp}｜手機單屏版</span></div>'
              t=re.sub(r'<body([^>]*)>',lambda m:m.group(0)+banner,t,count=1,flags=re.I)

          if re.search(r'\bfetch\s*\(|XMLHttpRequest\s*\(',t) or 'DecompressionStream' in t or 'atob(' in t:raise SystemExit('final safety check failed')
          day=now.strftime('%Y-%m-%d');p.write_text(t,encoding='utf-8');(root/f'{day}.html').write_text(t,encoding='utf-8')
          print('plain source=',source,'bytes=',len(t.encode()))
          PY
      - name: Commit normalized page
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/study/market/index.html public/study/market/$(TZ=Asia/Tokyo date +%F).html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'market: [plain-market] normalize EdgeOne page'
          git push
