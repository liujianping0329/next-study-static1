name: Refresh market dashboard

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_market_dashboard.py'
      - '.github/workflows/market-refresh.yml'
      - 'public/study/market/.refresh-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[market-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build fresh plain dashboard
        run: python scripts/refresh_market_dashboard.py
      - name: Static JS and release QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('public/study/market/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',t,re.S)
          if not scripts: raise SystemExit('no inline script found')
          Path('/tmp/dashboard.js').write_text('\n'.join(scripts),encoding='utf-8')
          if any(x in t for x in ['DecompressionStream','atob(','XMLHttpRequest','document.write(']): raise SystemExit('forbidden loader')
          if re.search(r'\bfetch\s*\(',t): raise SystemExit('runtime fetch forbidden')
          if '<th>時刻</th><th>天氣</th><th>氣溫</th><th>濕度</th><th>降雨率</th><th>雨量</th><th>UV</th>' not in t: raise SystemExit('7-col hourly QA failed')
          if '☀<small>' not in t or 'uvb' not in t: raise SystemExit('UV badge QA failed')
          PY
          node --check /tmp/dashboard.js
      - name: Commit refreshed release
        shell: bash
        run: |
          day=$(TZ=Asia/Tokyo date +%F)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/study/market/index.html public/study/market/$day.html
          if git diff --cached --quiet; then echo 'No dashboard changes'; exit 0; fi
          git commit -m "market: [market-refresh] publish $day fresh dashboard"
          git push
